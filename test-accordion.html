<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accordion Test Page — SnapGrab Verification</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1f2937;
    }
    h1 { font-size: 24px; margin-bottom: 24px; }
    .accordion-item {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .accordion-header {
      width: 100%;
      background: #f9fafb;
      padding: 16px 20px;
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    .accordion-header:hover { background: #f3f4f6; }
    .chevron {
      transition: transform 0.25s ease;
      width: 20px;
      height: 20px;
    }
    .accordion-item.open .chevron {
      transform: rotate(180deg);
    }
    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, padding 0.25s ease;
      background: #fff;
      padding: 0 20px;
    }
    .accordion-item.open .accordion-body {
      max-height: 200px;
      padding: 16px 20px;
    }
    details {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    summary {
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>SnapGrab Accordion Test</h1>

  <div class="accordion-item open" id="acc1">
    <button class="accordion-header" id="accBtn1" onclick="toggleAcc('acc1')">
      <span>Section 1: General Settings (Click to Collapse)</span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    <div class="accordion-body">
      <p>This is the content inside section 1. When expanded, this takes up vertical space.</p>
      <button id="insideBtn" onclick="alert('Inside clicked!')">Action inside accordion</button>
    </div>
  </div>

  <div class="accordion-item" id="acc2">
    <button class="accordion-header" id="accBtn2" onclick="toggleAcc('acc2')">
      <span>Section 2: Privacy & Security (Click to Expand)</span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    <div class="accordion-body">
      <p>This is the content inside section 2.</p>
    </div>
  </div>

  <details id="detailsEl">
    <summary>HTML5 Details Summary Accordion</summary>
    <p>Native details content that expands and collapses on click.</p>
  </details>

  <script>
    function toggleAcc(id) {
      const item = document.getElementById(id);
      item.classList.toggle('open');
    }
  </script>
</body>
</html>
